name: loyambo
description: A new Flutter project.
publish_to: none
version: 1.0.6+7
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.4
  get: ^4.7.3
  get_storage: ^2.1.1
  http: ^1.6.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  ota_update: ^7.1.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  sqflite: ^2.4.2
  uuid: ^4.5.3
  flutter_easyloading: ^3.0.5
  permission_handler: ^12.0.1
  device_info_plus: ^12.4.0
  blue_thermal_printer: ^1.2.3
  intl: ^0.18.1
  audioplayers: ^6.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
  - assets/animations/
  - assets/images/
  - assets/icons/
  - assets/svgs/
  - assets/sounds/
  fonts:
  - family: Staatliches
    fonts:
    - asset: assets/fonts/Staatliches/Staatliches-Regular.ttf
  - family: Ubuntu
    fonts:
    - asset: assets/fonts/Ubuntu/Ubuntu-Bold.ttf
    - asset: assets/fonts/Ubuntu/Ubuntu-BoldItalic.ttf
    - asset: assets/fonts/Ubuntu/Ubuntu-Italic.ttf
    - asset: assets/fonts/Ubuntu/Ubuntu-Light.ttf
    - asset: assets/fonts/Ubuntu/Ubuntu-LightItalic.ttf
    - asset: assets/fonts/Ubuntu/Ubuntu-Medium.ttf
    - asset: assets/fonts/Ubuntu/Ubuntu-MediumItalic.ttf
    - asset: assets/fonts/Ubuntu/Ubuntu-Regular.ttf
